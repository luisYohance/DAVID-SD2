<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="index.css" />
  </head>
  <body class="bg-dark">
    <!-- HEADER -->
    <h1
      class="h1 text-white bg-dark text-center align-items-center justify-content-center"
    >
      Rock, Paper, Scissors
    </h1>
    <h3
      class="h3 text-dark bg-danger text-center align-items-center justify-content-center"
    >
      Select your choice below, and then press `Enter` to start!
    </h3>

    <!-- ARENA -->
    <div
      class="p-4 d-flex justify-content-between align-items-center bg-secondary container-fluid"
      id="arena"
    >
      <div class="bg-danger-subtle" id="player">
        <img
          class="img-fluid position-relative"
          src="images/rockImg.jpg"
          alt=""
        />
        <h3
          class="text-white bg-danger text-center h3 nametag position-relative z-1"
        >
          PLAYER: 0
        </h3>
      </div>
      <div class="bg-primary-subtle" id="cpu">
        <img
          class="img-fluid position-relative"
          src="images/rockImg.jpg"
          alt=""
        />
        <h3
          class="position-relative text-white bg-primary text-center h3 nametag z-1"
        >
          CPU: 0
        </h3>
      </div>
    </div>

    <!-- BUTTONS -->
    <div class="align-items-center justify-content-evenly d-flex p-4">
      <div class="btn-group">
        <button
          class="btn btn-secondary btn-lg dropdown-toggle p-2"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          Choice
        </button>
        <ul class="dropdown-menu" id="choiceDropdown">
          <li><a class="dropdown-item" href="#">Rock</a></li>
          <li><a class="dropdown-item" href="#">Paper</a></li>
          <li><a class="dropdown-item" href="#">Scissors</a></li>
        </ul>
      </div>

      <button
        class="btn btn-secondary btn-lg p-2"
        id="enterButton"
        type="button"
        aria-expanded="false"
      >
        Enter
      </button>
    </div>

    <!-- BOOTSTRAP SCRIPT -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- SCRIPT -->
    <script src="index.js"></script>
  </body>
</html>
